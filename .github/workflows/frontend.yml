name: Frontend checks

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/doc/swagger/**'
      - 'Makefile'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/doc/swagger/**'
      - 'Makefile'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      STORYBOOK_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.1'
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - name: Lint
        run: node .yarn/releases/yarn-4.18.1.cjs lint
      - name: Check formatting
        run: node .yarn/releases/yarn-4.18.1.cjs format:check
      - name: Verify generated API client
        run: |
          node .yarn/releases/yarn-4.18.1.cjs generate
          git diff --exit-code -- generated/api-types
      - name: Type check
        run: node .yarn/releases/yarn-4.18.1.cjs typecheck
      - name: Build
        run: node .yarn/releases/yarn-4.18.1.cjs build
      - name: Build Storybook
        run: node .yarn/releases/yarn-4.18.1.cjs build-storybook
