name: Backend tests

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'Makefile'
      - '.github/workflows/backend-test.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'Makefile'
      - '.github/workflows/backend-test.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: talebound
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Run migrations
      run: make migrateup

    - name: Test
      run: make test

    - name: Verify dependencies
      run: |
        go mod verify
        go mod tidy -diff

    - name: Check vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
